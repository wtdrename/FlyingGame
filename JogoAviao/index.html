<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Voo 3D - Modular</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="ui">
    <h2>Flight Sim</h2>
    <div class="instrument">Velocidade: <span id="speed" class="stat">0</span></div>
    <div class="instrument">Altitude: <span id="alt" class="stat">0</span></div>
    <hr>
    <div class="controls-info">
        <kbd>W</kbd> <kbd>S</kbd> Potência Motor<br>
        <kbd>↑</kbd> <kbd>↓</kbd> Leme de Profundidade<br>
        <kbd>←</kbd> <kbd>→</kbd> Inclinação Lateral
    </div>
</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
